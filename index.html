<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rider</title>
  <style>
    body { margin: 0; background: #111; display: grid; place-items: center; height: 100vh; }
    canvas { background: #333; }
  </style>
</head>
<body>
    <div id="garage">
  <form id="bikeForm">
    <input id="bikeName" type="text" placeholder="Bike name" required>
    <input id="bikeColor" type="color" value="#ffd23f">
    <input id="bikeSpeed" type="number" min="1" max="10" value="4">
    <button type="submit">Add bike</button>
  </form>
  <ul id="bikeList"></ul>
</div>
     <canvas id="game" width="360" height="600"></canvas>
   <script src="garage.js"></script>
   <script src="game.js"></script>
</body>
</html>
